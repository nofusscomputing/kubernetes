---
apiVersion: v1
kind: Service
metadata:
  name: bind
  labels:
    app.kubernetes.io/component: bind9
    app.kubernetes.io/name: dns
spec:
  selector:
    app.kubernetes.io/component: bind9
    app.kubernetes.io/name: dns
  ports:
    - name: tcp
      port: 53
      protcol: tcp
      targetPort: dns-tcp
    - name: udp
      port: 53
      protocol: udp
      targetPort: dns-udp
