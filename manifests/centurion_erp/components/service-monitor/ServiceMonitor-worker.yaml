---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/component: service-monitor
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: centurion-erp
  name: worker
spec:
  endpoints:
  - interval: 30s
    port: metrics
    relabelings:
      - targetLabel: "job"
        replacement: "django"
  selector:
    matchLabels:
    app.kubernetes.io/component: service-monitor
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: centurion-erp
