---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: centurion
    app.kubernetes.io/part-of: centurion-erp
  name: api
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: centurion
      app.kubernetes.io/part-of: centurion-erp
  replicas: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: centurion
        app.kubernetes.io/part-of: centurion-erp
    spec:
      terminationGracePeriodSeconds: 10
      affinity: {}
      containers:

        - name: web
          image: nofusscomputing/centurion-erp:dev
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: '/tmp/prometheus'
          resources:
            limits:
              cpu: 1
              memory: 2Gi
            requests:
              cpu: 400m
              memory: 800Mi

          ports:
            - containerPort: 8000
              name: api

          volumeMounts:

            - name: celery-broker
              mountPath: /etc/itsm/10.celery-broker.py
              subPath: 10.celery-broker.py
              readOnly: true

            - name: configuration
              mountPath: /etc/itsm
              readOnly: true

            - name: data
              mountPath: /data
              subPath: data

            - name: database
              mountPath: /etc/itsm/20.database.py
              subPath: 20.database.py
              readOnly: true

            - mountPath: /var/log
              name: logs

            - mountPath: /tmp
              name: tmp
              subPath: tmp


        - name: ui
          image: nofusscomputing/centurion-erp-ui:dev
          env: []
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 20Mi

          ports:
            - containerPort: 80
              name: ui

          volumeMounts: []

      priorityClassName: cluster-low
      tolerations: []
      volumes:

        - name: celery-broker
          secret:
            secretName: celery-broker
            items:
              - key: 10.celery-broker.py
                path: 10.celery-broker.py

        - name: configuration
          configMap:
            name: configuration

        - name: data
          persistentVolumeClaim:
            claimName: centurion

        - name: database
          secret:
            secretName: database
            items:
              - key: 20.database.py
                path: 20.database.py

        - name: logs
          hostPath:
            path: /opt/logs/centurion-api
            type: DirectoryOrCreate

        - name: tmp
          emptyDir:
            medium: Memory
            # sizeLimit: 64Mi
