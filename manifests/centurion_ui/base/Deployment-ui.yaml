---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: ui
    app.kubernetes.io/part-of: centurion-ui
  name: centurion-ui
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ui
      app.kubernetes.io/part-of: centurion-ui
  replicas: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui
        app.kubernetes.io/part-of: centurion-ui
    spec:
      terminationGracePeriodSeconds: 10
      affinity: {}
      containers:

        - name: ui
          image: nofusscomputing/centurion-ui:dev
          env: []
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 10m
              memory: 20Mi

          ports:
            - containerPort: 80
              name: ui

          volumeMounts: []

      tolerations: []
      volumes: []
