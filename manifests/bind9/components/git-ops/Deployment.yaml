---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns
spec:
  template:

    spec:

      containers:

        - name: git
          image: alpine:3.23.2
          command:
            - sh
            - -c
            - |
              echo "Installing pre-reqs.....";

              apk update;
              apk add git openssh-client-default;

              KEY_FILE_NAME="~/.ssh/${SSH_REPOSITORY_OWNER}/${SSH_REPOSITORY_NAME}/deploy";

              echo "Env var KEY_FILE_NAME=[${KEY_FILE_NAME}] setup";

              echo ${SSH_PRIVATE_KEY} > ${SSH_REPOSITORY_NAME};

              chmod 600 ${SSH_REPOSITORY_NAME};

              export GIT_SSH_COMMAND="ssh -i ${KEY_FILE_NAME}";

              while :; do

                echo "Loop Start......";

                if [ -d /git/.git ]; then

                  REPO_NAME_FULL="${SSH_REPOSITORY_HOST}/${SSH_REPOSITORY_OWNER}/${SSH_REPOSITORY_NAME}.git"

                  echo "Env var REPO_NAME_FULL=[${REPO_NAME_FULL}] setup";

                  echo "Clonning repo";

                  git clone -b master ${REPO_NAME_FULL} /git;

                else

                  echo "********************************************";

                  git status;

                  echo "********************************************";
                  cd /git;

                  echo "Checking for repo updates";

                  git fetch -fpvt;

                  echo "Pulling any changes....";

                  git pull --rebase

                fi


                sleep 300

              done;

          env:
            - name: SSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_PRIVATE_KEY
            - name: SSH_REPOSITORY_HOST
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_HOST
            - name: SSH_REPOSITORY_OWNER
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_OWNER
            - name: SSH_REPOSITORY_NAME
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_NAME

          resources:
            limits:
              cpu: 1
              memory: 500Mi
            requests:
              cpu: 50m
              memory: 150Mi
          volumeMounts:
            - name: data
              mountPath: /git
              subPath: git/
