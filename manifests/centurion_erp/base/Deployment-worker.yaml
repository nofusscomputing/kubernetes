---

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: centurion-erp
  name: worker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
      app.kubernetes.io/part-of: centurion-erp
  replicas: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: centurion-erp
    spec:
      terminationGracePeriodSeconds: 10
      affinity: {}
      containers:
        - name: worker
          image: nofusscomputing/centurion-erp:dev
          env:
            - name: IS_WORKER
              value: "true"
          resources:
            limits:
              cpu: 800m
              memory: 200Mi
            requests:
              cpu: 10m
              memory: 20Mi

          ports:
            - containerPort: 8080
              name: metrics

          volumeMounts:

            - name: configuration
              mountPath: /etc/itsm
              readOnly: true

            - mountPath: /var/log
              name: logs

            - mountPath: /tmp
              name: tmp
              subPath: tmp

      tolerations: []
      volumes:

        - name: configuration
          projected:
            sources:
              - configMap:
                  name: configuration
                  items:
                    - key: 00.settings.py
                      path: 00.settings.py
              - secret:
                  name: celery-broker
                  items:
                    - key: 10.celery-broker.py
                      path: 10.celery-broker.py
              - secret:
                  name: database
                  items:
                    - key: 20.database.py
                      path: 20.database.py

        - name: logs
          hostPath:
            path: /opt/logs/centurion-worker
            type: DirectoryOrCreate

        - name: tmp
          emptyDir:
            medium: Memory
            # sizeLimit: 64Mi
