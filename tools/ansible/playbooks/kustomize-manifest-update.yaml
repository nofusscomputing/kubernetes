---

- name: Update Kustomize manifests directory
  hosts: localhost
  gather_facts: false
  connection: local


  pre_tasks:


    - name: Play Facts
      ansible.builtin.set_fact:
        repo_root: "{{ lookup('ansible.builtin.env', 'PWD') }}"


    - name: Ensure manifest directory specified
      ansible.builtin.assert:
        that:
          - dir_manifest is defined
          - dir_manifest is not none
        fail_msg: dir_manifest is a required variable.


    - name: Find manifest role directories
      ansible.builtin.find:
        paths: "{{ repo_root }}/{{ dir_manifest }}/ansible"
        file_type: directory
        recurse: false
      register: source_dirs


    - name: Run manifest tasks
      ansible.builtin.include_role:
        name: kustomize-manifest-update
        tasks_from: assemble


  tasks:


    - name: Run manifest tasks
      ansible.builtin.include_role:
        name: kustomize-manifest-update


  post_tasks:


    - name: Commit any changes
      ansible.builtin.include_role:    # noqa: no-handler
        name: git
      vars:
        git_commit_exclude:
          - "{{ repo_root + '/' + dir_manifest }}/ansible"
        git_commit_path: "{{ repo_root + '/' + dir_manifest }}"
        git_commit_message: "build: update path {{ git_branch_working }}"


    - name: Create PR
      ansible.builtin.include_role:    # noqa: no-handler
        name: github
        tasks_from: pull-request
      vars:
        github_branch_working: "{{ git_branch_working | string }}"
        github_assign_pull_request: true
        github_pull_request_title: "build: Updated {{ dir_manifest }}"
      when: git_commit_create.changed | default(false)
