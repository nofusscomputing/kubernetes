---

apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

generatorOptions:
  disableNameSuffixHash: true

namespace: centurion

secretGenerator:
  - name: social_auth_keycloak
    files:
      - social_auth_keycloak.py

patches:

  - patch: |-
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: social-auth-keycloak
          mountPath: /etc/itsm/social_auth_keycloak.py
          subPath: social_auth_keycloak.py
          readOnly: true

      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: social-auth-keycloak
          configMap:
            name: social-auth-keycloak
            items:
              - key: social_auth_keycloak.py
                path: social_auth_keycloak.py

    target:
      kind: Deployment
      name: api
      version: v1
