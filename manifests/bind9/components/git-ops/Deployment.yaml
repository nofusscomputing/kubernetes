---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: bind
spec:
  template:

    spec:

      containers:

        - name: git
          image: alpine:3.23.2
          command:
            - sh
            - -c
            - |
              echo "Installing pre-reqs.....";

              apk update;
              apk add bind git openssh-client-default;

              export KEY_FILE_PATH=~/.ssh/${SSH_REPOSITORY_OWNER}/${SSH_REPOSITORY_NAME};

              chmod 600 ${KEY_FILE_PATH}/deploy;

              export GIT_SSH_COMMAND="ssh -i $KEY_FILE_PATH/deploy";

              while :; do

                echo "Loop Start......";


                cd /git;

                chown 0:0 -R /git/.git

                if ssh -T "git@$SSH_REPOSITORY_HOST" -i $KEY_FILE_PATH/deploy; then

                  echo "Updating repo on SSH_REPOSITORY_REF=[${SSH_REPOSITORY_REF}]";

                  echo "********************************************";

                  git status;

                  echo "********************************************";
                  
                  echo "Checking for repo updates";

                  git fetch -fpvt;

                  echo "Git reset....";

                  git reset --hard;

                  if [ "${SSH_REPOSITORY_REF:-}" = "tag" ]; then

                    echo "'tag' or nothing supplied for variable SSH_REPOSITORY_REF, fetching latest git tag to use.";

                    export REPO_NAME_FULL="${SSH_REPOSITORY_HOST}:${SSH_REPOSITORY_OWNER}/${SSH_REPOSITORY_NAME}.git"

                    export SSH_REPOSITORY_REF=$(git ls-remote --tags --sort=-v:refname git@${REPO_NAME_FULL} | sed 's#.*/##' | grep -v '\^{}' | head -n 1);

                    echo "Using SSH_REPOSITORY_REF=[${SSH_REPOSITORY_REF}]";

                  fi

                  git checkout "${SSH_REPOSITORY_REF}";

                  echo "Pulling any changes....";

                  git pull --rebase


                else

                  echo "Not Authenticated, check ssh key. RC=[${?}]";

                fi


                chown 53:53 -R /etc/bind

                chown 53:53 -R /var/bind

              if [ -d /etc/bind/conf.d/extra ]; then

                if [ -f /etc/bind/conf.d/extra/rndc.conf ]; then

                  echo "********************************************";

                  echo "Reloading zones.....";

                  rndc -4 -k /etc/bind/keys/rndc.key -s 127.0.0.1 -r reload

                  echo "********************************************";


                fi

              fi


                echo "Loop Finish.";

                sleep 300

              done;

          env:
            - name: SSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_PRIVATE_KEY
            - name: SSH_REPOSITORY_HOST
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_HOST
            - name: SSH_REPOSITORY_OWNER
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_OWNER
            - name: SSH_REPOSITORY_NAME
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_NAME
            - name: SSH_REPOSITORY_REF
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_REF

          resources:
            limits:
              cpu: 1
              memory: 500Mi
            requests:
              cpu: 50m
              memory: 150Mi
          volumeMounts:

            - name: data
              mountPath: /etc/bind/conf.d/extra
              subPath: extra/

            - name: data
              mountPath: /etc/bind/keys
              subPath: keys/

            - name: data
              mountPath: /git
              subPath: git/

            - name: data
              mountPath: /root
              subPath: home

            - mountPath: /var/dns-log
              name: data
              subPath: logs

      initContainers:

        - name: clone
          image: alpine:3.23.2
          command:
            - sh
            - -c
            - |
              echo "Start init";


              echo "Installing pre-reqs.....";

              apk update;
              apk add bind git openssh-client-default;

              if [ -d /etc/bind/conf.d/extra ]; then

                if [ -f /etc/bind/conf.d/extra/rndc.conf ]; then


                  echo "********************************************";

                  echo "Generating rndc key....";

                  rndc-confgen -a -c /etc/bind/keys/rndc.key;

                  echo "********************************************";

                fi

              fi


              export KEY_FILE_PATH=~/.ssh/${SSH_REPOSITORY_OWNER}/${SSH_REPOSITORY_NAME};

              mkdir -p "${KEY_FILE_PATH}";

              echo "Env var KEY_FILE_PATH=[${KEY_FILE_PATH}] setup";

              echo "$SSH_PRIVATE_KEY" > ${KEY_FILE_PATH}/deploy


              chmod 600 ${KEY_FILE_PATH}/deploy;

              export GIT_SSH_COMMAND="ssh -i $KEY_FILE_PATH/deploy";

              ssh-keyscan "${SSH_REPOSITORY_HOST}" >> ~/.ssh/known_hosts


              export REPO_NAME_FULL="${SSH_REPOSITORY_HOST}:${SSH_REPOSITORY_OWNER}/${SSH_REPOSITORY_NAME}.git"

              echo "Env var REPO_NAME_FULL=[${REPO_NAME_FULL}] setup";


              if [ ! -d /git/.git ]; then


                if ssh -T "git@$SSH_REPOSITORY_HOST" -i  $KEY_FILE_PATH/deploy; then

                  echo "Clonning repo on branch=[${SSH_REPOSITORY_REF}]";

                  if [ "${SSH_REPOSITORY_REF}"=="tag" ]; then

                    echo "'tag' or nothing supplied for variable SSH_REPOSITORY_REF, fetching latest git tag to use.";

                    SSH_REPOSITORY_REF=$(git ls-remote --tags --sort=-v:refname git@${REPO_NAME_FULL} | sed 's#.*/##' | grep -v '\^{}' | head -n 1)

                  fi


                  git clone -b "${SSH_REPOSITORY_REF}" git@${REPO_NAME_FULL} /git;

                else

                  echo "Not Authenticated, check ssh key. RC=[${?}]";

                  exit 1;

                fi

              else


                cd /git;

                if ssh -T "git@$SSH_REPOSITORY_HOST" -i $KEY_FILE_PATH/deploy; then

                  echo "Updating repo on SSH_REPOSITORY_REF=[${SSH_REPOSITORY_REF}]";

                  echo "********************************************";

                  git status;

                  echo "********************************************";
                  
                  echo "Checking for repo updates";

                  git fetch -fpvt;

                  echo "Git reset....";

                  git reset --hard;


                  if [ "${SSH_REPOSITORY_REF:-}" = "tag" ]; then

                    echo "'tag' or nothing supplied for variable SSH_REPOSITORY_REF, fetching latest git tag to use.";

                    SSH_REPOSITORY_REF=$(git ls-remote --tags --sort=-v:refname git@${REPO_NAME_FULL} | sed 's#.*/##' | grep -v '\^{}' | head -n 1)

                    echo "Using SSH_REPOSITORY_REF=[${SSH_REPOSITORY_REF}]";

                    git checkout "${SSH_REPOSITORY_REF}"

                  else

                    git checkout "${SSH_REPOSITORY_REF}"

                    echo "Pulling any changes....";

                    git pull --rebase

                  fi


                else

                  echo "Not Authenticated, check ssh key. RC=[${?}]";

                fi


              fi


              echo "Finish init";

          env:
            - name: SSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_PRIVATE_KEY
            - name: SSH_REPOSITORY_HOST
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_HOST
            - name: SSH_REPOSITORY_OWNER
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_OWNER
            - name: SSH_REPOSITORY_NAME
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_NAME
            - name: SSH_REPOSITORY_REF
              valueFrom:
                secretKeyRef:
                  name: bind-config
                  key: SSH_REPOSITORY_REF

          resources:
            limits:
              cpu: 1
              memory: 500Mi
            requests:
              cpu: 50m
              memory: 150Mi

          volumeMounts:

            - name: data
              mountPath: /etc/bind/conf.d/extra
              subPath: extra/

            - name: data
              mountPath: /etc/bind/keys
              subPath: keys/

            - name: data
              mountPath: /git
              subPath: git

            - name: data
              mountPath: /root
              subPath: home
