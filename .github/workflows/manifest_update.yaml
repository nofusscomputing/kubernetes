---

name: 'Update Kustomize Manifest'

on:
  workflow_dispatch:
    inputs:
      KUSTOMIZE_APP_DIR:
        required: true
        description: Name of the directory to update.
        type: string


jobs:

  update:
    name: 'Update Kustomize Manifest Directory'
    runs-on: ubuntu-latest
    outputs:
      version-current: ${{ steps.version-current.outputs.value-out }}
      version-new: ${{ steps.version-new.outputs.value-out }}
    steps:


      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
        with:
          fetch-depth: 0


      - run: git branch -a


      - name: "Install Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97    # v7.0.0
        with:
            python-version: "3.12"


      - name: "Install packages"
        shell: bash
        run: |
            python -m pip install "ansible-core==2.18.6";


      - name: Install collections
        shell: bash
        run: |
          ansible-galaxy collection install -r tools/ansible/requirements.yaml;


      - name: Run Play against "${{ inputs.KUSTOMIZE_APP_DIR }}"
        shell: bash
        env:
          ANSIBLE_FORCE_COLOR: "1"
          GIT_AUTHOR_NAME: nfc_bot
          GIT_AUTHOR_EMAIL: helpdesk@nofusscomputing.com
          GIT_COMMITTER_NAME: nfc_bot
          GIT_COMMITTER_EMAIL: helpdesk@nofusscomputing.com
        run: |-
          ansible-playbook tools/ansible/playbooks/kustomize-manifest-update.yaml \
            --extra-vars "dir_manifest=manifests/${{ inputs.KUSTOMIZE_APP_DIR }}" \
            -vvv
